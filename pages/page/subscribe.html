	async function getNonce() {
		// 1. 获取注入的实例（注意是小写 t）
		const tw = window.tronWeb;

		if (!tw || !tw.ready) {
			console.error("TronLink 未就绪，请确保已登录并刷新页面");
			// 尝试通过 tron_requestAccounts 唤醒
			await window.tronLink.request({ method: 'tron_requestAccounts' });
			return;
		}

		// 合约地址（Base58 格式）
		let contractAddress = $("#contractAddress").val().trim();
		const userAddress = tw.defaultAddress.base58;

		console.log(contractAddress)
		if (contractAddress.startsWith('0x')) {
			contractAddress = contractAddress.substring(2);
		}
		const base58Addr = tw.address.fromHex(contractAddress);
		const contract = await tronWeb.contract(ABI, base58Addr);
		const nonce = await contract.nonces(userAddress).call();

		console.log("当前 Nonce:", nonce.toString());
		$("#nonceValue").html("账户["+userAddress+"]在合约[" +
				base58Addr +
				"]上的nonce为："+ nonce.toString());
		$("#nonce").val(nonce.toString());
	}
	async function signMsg() {
		// 1. 获取注入的实例（注意是小写 t）
		const tw = window.tronWeb;

		if (!tw || !tw.ready) {
			console.error("TronLink 未就绪，请确保已登录并刷新页面");
			// 尝试通过 tron_requestAccounts 唤醒
			await window.tronLink.request({ method: 'tron_requestAccounts' });
			return;
		}
		// 合约地址（Base58 格式）
		let contractAddress = $("#contractAddress").val().trim();

		const domain = {
			name: 'Subscribe',
			version: '1',
			chainId: '0xcd8690dc', // Nile (测试网)
			verifyingContract: contractAddress
		};
		if (contractAddress.startsWith('0x')) {
			contractAddress = contractAddress.substring(2);
		}
		const base58Addr = tw.address.fromHex(contractAddress);
		const contract = await tronWeb.contract(ABI, base58Addr);

		const types = {
			SubscribeUser: [
				{ name: 'planId', type: 'uint48' },
				{ name: 'enabled', type: 'bool' },//是否启用
				{ name: 'chargeMode', type: 'uint8' },//扣费模式（0=先扣后用，1=先用后扣）
				{ name: 'amount', type: 'uint256' },//单周期扣款金额
				{ name: 'version', type: 'uint16' },//方案版本号，商户每修改一次 +1
				{ name: 'cycle', type: 'uint32' },//周期（单位：秒，如周 = 7*86400）
				{ name: 'trialPeriod', type: 'uint32' },//周期（单位：秒，如周 = 7*86400）,大于零代表试用状态，等于零代表非试用状态
				{ name: 'token', type: 'address' },//计费币种（USDT/USDC 等）
				{ name: 'wallet', type: 'address' },
				{ name: 'nextPayTime', type: 'uint32' },//周期（单位：秒，如周 = 7*86400）
				{ name: 'nonce', type: 'uint256' },//nonce 自增的数字
			]
		};
		const userAddress = tw.defaultAddress.base58;
		const value = {
			planId: $("#planId").val().trim(),
			enabled:true,
			chargeMode:$("#chargeMode").val().trim(),
			amount:$("#amount").val().trim(),
			version:$("#version").val().trim(),
			cycle:$("#cycle").val().trim(),
			trialPeriod:$("#trialPeriod").val().trim(),
			token:$("#token").val().trim(),
			wallet:userAddress,
			nextPayTime:$("#nextPayTime").val().trim(),
			nonce:$("#nonce").val().trim(),
		}
		const user={
			"wallet":value.wallet,
			"planId": value.planId,
			"version": value.version,//方案版本号，必须与商户一致，否则无效
			"nextPayTime": value.nextPayTime,//下次扣费时间 单位：秒，如周 = 7*86400）
		}
		const userHash=$("#userHash").val().trim()
		try {
			// 2. 使用正确的方法名：_signTypedData
			// 注意：这是异步操作，必须加 await
			const signature = await tw.trx._signTypedData(domain, types, value);
			const signatureNew = signature.slice(0, 130)+'00'+signature.slice(130, 132)
			//const userHash =await ethers.solidityPackedKeccak256([ "bytes32", "address" ], [userHashOrigin,user.wallet]);
			await contract.addOrUpdateSubscribeUser(user,userHash,signatureNew).send()
			console.log("签名结果:", signature);
		} catch (err) {
			console.error("用户拒绝签名或出错:", err);
		}
	}
