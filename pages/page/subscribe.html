<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta
	content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
	name="viewport" />
<title></title>
<link href="../../dist/css/lanai-ui.min.css" rel="stylesheet" />
	<script src="../../dist/js/jquery.min.js"></script>
	<script src="TronWeb.js"></script>
	<script src="../../dist/js/lanai-ui.min.js"></script>
	<script src="../../dist/js/ethers.umd.min.js"></script>
	<script language="JavaScript">
		const tronWeb =window.TronWeb;

		function signMsg() {
// 作用域中的所有属性都是可选的
			const domain = {
				name: 'Subscribe',
				version: '1',
				chainId: '0x2b6653dc',
				verifyingContract: '0xA6cBb1e75d42b3abAE7c419E5ce5ceB2B0b2CEE7'
			};
			console.log("domain", domain)
			// 所有类型定义的name列表
			const types = {
				Subscribe: [
					{name: 'planId', type: 'uint48'},
					{name: 'enabled', type: 'bool'},//是否启用
					{name: 'chargeMode', type: 'uint8'},//扣费模式（0=先扣后用，1=先用后扣）
					{name: 'amount', type: 'uint256'},//单周期扣款金额
					{name: 'version', type: 'uint16'},//方案版本号，商户每修改一次 +1
					{name: 'cycle', type: 'uint32'},//周期（单位：秒，如周 = 7*86400）
					{name: 'trialPeriod', type: 'uint32'},//周期（单位：秒，如周 = 7*86400）,大于零代表试用状态，等于零代表非试用状态
					{name: 'token', type: 'address'},//计费币种（USDT/USDC 等）
					{name: 'nonce', type: 'uint256'},//nonce 自增的数字
				]
			};

// 待签名的数据
			const value = {
				planId: 100,
				enabled: true,
				chargeMode: 1,
				amount: 1000000000000000,
				version: 10,
				cycle: 3600,
				trialPeriod: 3600,
				token: '0xA6cBb1e75d42b3abAE7c419E5ce5ceB2B0b2CEE7',
				nonce: 0,
			};
			const signature = tronWeb.Trx.signTypedData(domain, types, value);
			console.log("signature ", signature);
		}
		signMsg();
	</script>
</head>

</body>
</html>
